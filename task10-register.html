<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Task 10 - Register</title>
    <link rel="stylesheet" href="task10.css">
</head>

<body>

    <div class="auth-container">

        <h1>Task 10</h1>
        <h2>Create Account</h2>

        <form id="register-form">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="/task10/task10-login.html">
                Login
            </a>
        </p>

    </div>

    <script src="task10-register.js"></script>

</body>

</html>
