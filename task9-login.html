<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 9 Login</title>

    <link rel="stylesheet" href="./task9.css">

</head>

<body>

    <div class="container">

        <h1>Task 9 Login</h1>

        <form id="login-form">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >


            <button type="submit">
                Login
            </button>


            <p id="message"></p>

        </form>


        <a href="/task9/task9-register.html">
            Create an Account
        </a>

    </div>


    <script src="task9-login.js"></script>

</body>

</html>
