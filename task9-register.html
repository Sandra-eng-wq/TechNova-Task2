<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 9 Registration</title>

    <link rel="stylesheet" href="./task9.css">

</head>

<body>

    <div class="container">

        <h1>Task 9 Registration</h1>

        <form id="register-form">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >


            <label for="role">
                Role
            </label>

            <select id="role">

                <option value="employee">
                    Employee
                </option>

                <option value="admin">
                    Administrator
                </option>

            </select>


            <button type="submit">
                Register
            </button>


            <p id="message"></p>

        </form>


        <a href="/task9/task9-login.html">
            Go to Login
        </a>

    </div>


    <script src="task9-register.js"></script>

</body>

</html>
